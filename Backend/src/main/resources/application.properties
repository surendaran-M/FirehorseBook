# Server
server.port=8080

# Database Configuration (MySQL)
# Updated to match your Railway variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Important: Use the PORT variable provided by Railway
server.port=${PORT:8080}

# Update CORS to allow your future Vercel/Railway frontend URL
# Replace the placeholder below with your actual frontend URL once you have it
cors.allowed-origins=http://localhost:5173,https://your-frontend-name.vercel.app
# Remove or comment this line - Spring Boot 4.x auto-detects dialect
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (allow frontend)


# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.example.demo=DEBUG
