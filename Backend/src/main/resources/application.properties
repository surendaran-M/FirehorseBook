# --- Server Configuration ---
# This allows Render to set the port dynamically while defaulting to 8080 locally
server.port=${PORT:8080}

# --- Database Configuration (TiDB Cloud) ---
# Note: Port 4000 is specific to TiDB. UseSSL is required for Cloud clusters.
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?enabledTLSProtocols=TLSv1.2,TLSv1.3&useSSL=true
spring.datasource.username=4KzC7YDEFNaGDp4.root
spring.datasource.password=0sbEsBF9H9weIvLe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- File Upload (For Book Images/Resumes) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Security & CORS ---
# Update the Vercel link to your actual project URL: firehorse-book.vercel.app
cors.allowed-origins=http://localhost:5173,https://firehorse-book.vercel.app

# --- Logging (For Debugging Connections) ---
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
